services:
  postgres:
    image: postgres:17-alpine
    container_name: trinity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-JAMZ}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: TeamServer/Dockerfile
      target: migrator
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=postgres;Username=postgres;Password=${POSTGRES_PASSWORD:-JAMZ}"
    depends_on:
      postgres:
        condition: service_healthy

  teamserver:
    build:
      context: .
      dockerfile: TeamServer/Dockerfile
      target: runtime
    container_name: trinity-teamserver
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5069:5069"
      - "5070:5070"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=postgres;Username=postgres;Password=${POSTGRES_PASSWORD:-JAMZ}"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      Jwt__Key: ${JWT_KEY:-change-me-0123456789abcdef0123456789abcdef}
      Jwt__Issuer: ${JWT_ISSUER:-TrinityTeamServer}
      Jwt__Audience: ${JWT_AUDIENCE:-TrinityClient}
      # Lab-only: POST /api/v1/auth/register creates operator accounts so a client build can be
      # exercised without Firebase. Unset (false) in appsettings for any non-lab deployment.
      Auth__AllowSelfRegistration: ${ALLOW_SELF_REGISTRATION:-true}
    volumes:
      - ./Agent:/Agent:ro
      - ./Payloads:/app/Payloads
      # Uploaded and agent-received files lived in the container's writable layer, so every
      # rebuild silently discarded an operator's loot. These are data, not build output.
      - ./uploads:/app/uploads
      - ./storage:/app/storage
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/v1/server/status > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  client:
    build:
      context: .
      dockerfile: Client/Dockerfile
    container_name: trinity-client
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      TeamServer__BaseUrl: http://teamserver:5000
    volumes:
      # Data protection key ring: the sign-in and bearer token live in protected session storage,
      # which cannot be decrypted after a restart without it.
      - client-keys:/app/keys
    depends_on:
      teamserver:
        condition: service_healthy

volumes:
  pgdata:
  client-keys:
